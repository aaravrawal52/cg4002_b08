<!DOCTYPE html>
<html>
<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>CG4002 Comms Test</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        #status {
            font-size: 18px;
            margin-bottom: 40px;
        }

        #gesture {
            font-size: 42px;
            font-weight: bold;
            margin: 30px 0;
        }

        #confidence {
            font-size: 24px;
        }

        #sequence {
            margin-top: 30px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<h1>CG4002 Comms</h1>

<div id="status">
    Connecting...
</div>

<div id="gesture">
    -
</div>

<div id="confidence">
</div>

<div id="sequence">
</div>


<script>

const MAC_IP = window.location.hostname;

const socket = new WebSocket(
    `ws://${MAC_IP}:8765`
);


socket.onopen = function() {

    document.getElementById(
        "status"
    ).innerText = "Connected";

};


socket.onmessage = function(event) {

    const message = JSON.parse(
        event.data
    );

    if (message.type === "GESTURE") {

        document.getElementById(
            "gesture"
        ).innerText =
            message.gesture;

        document.getElementById(
            "confidence"
        ).innerText =
            "Confidence: "
            + Math.round(
                message.confidence * 100
            )
            + "%";

        document.getElementById(
            "sequence"
        ).innerText =
            "Sequence: "
            + message.sequence;
    }

};


socket.onclose = function() {

    document.getElementById(
        "status"
    ).innerText = "Disconnected";

};

</script>

</body>
</html>
